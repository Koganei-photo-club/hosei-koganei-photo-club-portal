<form id="eventForm"><input type="hidden" name="eventId"><input type="hidden" name="createdAt"><div class="form-grid"><label class="full">予定名（必須）<input name="title" required></label><label>ジャンル<select name="genre" required><option value="">選択</option><option value="meeting">全体会</option><option value="camp">合宿</option><option value="exhibition">写真展</option></select></label><label id="subtypeBox">全体会種別<select name="subtype"><option value="shooting">撮影会</option><option value="dining">お食事会</option></select></label><label>開始日時<input type="datetime-local" name="startAt"></label><label>終了日時<input type="datetime-local" name="endAt"></label><label>場所<input name="place"></label><label>企画幹部の連絡先<input name="contact"></label><label class="full">必要事項<textarea name="details" rows="4"></textarea></label><div id="shootingFields" class="conditional full"><label><input type="checkbox" name="cameraEnabled"> 貸出カメラを受付（上限3台）</label><label><input type="checkbox" name="disposableEnabled"> 写るんですを受付</label></div><div id="campFields" class="conditional form-grid full"><label>費用<input type="number" name="fee" min="0"></label><label>支払期限<input type="datetime-local" name="paymentDeadline"></label></div><div id="exhibitionFields" class="conditional form-grid full"><label>写真展タイトル<input name="exhibitionTitle"></label><label>出展可能作品数<input type="number" name="maxWorks" min="1"></label><label>最低シフト人数<input type="number" name="minShiftPeople" min="1"></label><label class="full">シフト枠（1行1枠）<textarea name="shiftSlotsText" placeholder="8/23 15:00〜17:00"></textarea></label></div></div><div class="actions"><button type="button" class="secondary" id="draft">一時保存</button><button type="submit">保存</button></div></form>
