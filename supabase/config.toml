# Local Phase 1-3 verification only. No remote project reference or secrets.
project_id = "hosei-photo-portal-phase123-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

# Migrations are intentionally applied by scripts/local-phase123-bootstrap.sh.
# The 2026 summer archive migration needs local fixture rows immediately before
# migration 202609030018, while normal Supabase seeds run only after migrations.
[db.migrations]
enabled = false

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "100MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

