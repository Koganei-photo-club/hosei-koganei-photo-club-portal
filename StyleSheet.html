<style>:root{--ink:#17231c;--green:#1c5b3c;--mint:#dcebe1;--paper:#f5f4ef;--line:#d9ddd8;--white:#fff;--orange:#df6b35;--font-gothic:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif}*{box-sizing:border-box}html,body,button,input,select,textarea{font-family:var(--font-gothic)}body{margin:0;background:var(--paper);color:var(--ink);line-height:1.7}body:before{content:"";position:fixed;inset:0 0 auto;height:6px;background:linear-gradient(90deg,var(--green) 70%,var(--orange) 70%);z-index:9}.top{max-width:1120px;margin:auto;padding:48px 24px 24px;display:flex;align-items:end;justify-content:space-between;gap:24px}.top p,.section-title p{margin:0;color:var(--green);font-size:.72rem;font-weight:800;letter-spacing:.18em}.top h1{margin:.1em 0;font-family:var(--font-gothic);font-size:clamp(2rem,5vw,3.6rem);line-height:1.1}main{max-width:1120px;margin:auto;padding:12px 24px 80px}.panel,.event-card{background:var(--white);border:1px solid var(--line);border-radius:3px;padding:26px;box-shadow:0 8px 30px #1a38210b}.notice{margin:0 0 22px;padding:14px 18px;background:var(--mint);border-left:4px solid var(--green)}.section-title{display:flex;justify-content:space-between;align-items:end;margin:44px 0 16px}.section-title h2{margin:0;font-family:var(--font-gothic)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.event-card{display:flex;justify-content:space-between;align-items:center;color:inherit;text-decoration:none;transition:.2s}.event-card:hover{transform:translateY(-3px);border-color:var(--green)}.event-card h3,.panel h2,.panel h3{margin:.35em 0}.event-card p,.panel p{margin:.2em 0;color:#536057}.arrow{font-size:1.8rem;color:var(--green)}.tag{display:inline-block;color:var(--green);font-size:.72rem;font-weight:800;letter-spacing:.08em}.hidden{display:none!important}.button,button{display:inline-block;border:0;border-radius:2px;background:var(--green);color:#fff;padding:11px 18px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}.ghost,.secondary{background:transparent;color:var(--green);border:1px solid var(--green)}button:disabled{opacity:.45}.tabs{display:flex;gap:4px;margin:10px 0 18px;border-bottom:1px solid var(--line)}.tabs button{background:transparent;color:#59635c;border-radius:0}.tabs button.active{color:var(--green);border-bottom:3px solid var(--green)}.admin-row{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:18px 0;border-bottom:1px solid var(--line)}.admin-row h3,.admin-row p{margin:0}.admin-row>div:last-child{display:flex;align-items:center;gap:16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}label{display:block;font-weight:700}input,select,textarea{display:block;width:100%;margin-top:5px;padding:11px;border:1px solid #bdc5bf;border-radius:2px;background:#fff;font:inherit}input[type=checkbox]{display:inline;width:auto;margin-right:7px}.conditional label{margin-bottom:10px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.agreement{padding:18px;margin:18px 0;background:#fff5ec;border:1px solid #efc3a9}.agreement p{color:#45382f}dl{display:grid;grid-template-columns:90px 1fr}dt{font-weight:800}dd{margin:0}.work{border-top:1px solid var(--line);padding:10px 0}@media(max-width:650px){.top{align-items:flex-start;flex-direction:column;padding:34px 16px 18px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.admin-row{align-items:flex-start;flex-direction:column}.panel{padding:20px}main{padding-inline:16px}}</style>
