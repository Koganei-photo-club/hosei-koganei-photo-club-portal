<script>
let authToken='',authReadyCallback=null,authEmail='';
function beginGoogleAuth(callback){authReadyCallback=callback;const saved=sessionStorage.getItem('hosei_app_session');if(saved)return verifyAppSession(saved);showEmailStep()}
document.addEventListener('DOMContentLoaded',()=>{const emailForm=document.getElementById('authEmailForm'),codeForm=document.getElementById('authCodeForm'),changeButton=document.getElementById('changeEmail');if(!emailForm||!codeForm||!changeButton)return;emailForm.onsubmit=sendLoginCode;codeForm.onsubmit=confirmLoginCode;changeButton.onclick=showEmailStep});
function showEmailStep(){document.getElementById('authGate').classList.remove('hidden');document.getElementById('authEmailForm').classList.remove('hidden');document.getElementById('authCodeForm').classList.add('hidden');document.getElementById('authMessage').textContent='大学メールアドレスへ6桁の確認コードを送信します。'}
function sendLoginCode(event){event.preventDefault();authEmail=document.getElementById('authEmail').value.trim().toLowerCase();const button=event.target.querySelector('button');button.disabled=true;document.getElementById('authMessage').textContent='確認コードを送信しています…';google.script.run.withSuccessHandler(result=>{button.disabled=false;document.getElementById('authEmailForm').classList.add('hidden');document.getElementById('authCodeForm').classList.remove('hidden');document.getElementById('authMessage').textContent=result.masked+' に確認コードを送信しました。有効期限は10分です。';document.getElementById('authCode').focus()}).withFailureHandler(error=>{button.disabled=false;authError(error.message||'確認コードを送信できませんでした。')}).requestEmailLogin(authEmail)}
function confirmLoginCode(event){event.preventDefault();const code=document.getElementById('authCode').value.trim(),button=event.target.querySelector('button[type=submit]');button.disabled=true;document.getElementById('authMessage').textContent='確認しています…';google.script.run.withSuccessHandler(result=>{authToken=result.session;sessionStorage.setItem('hosei_app_session',result.session);document.getElementById('authGate').classList.add('hidden');authReadyCallback(result.session,{email:result.email,isAdmin:result.isAdmin})}).withFailureHandler(error=>{button.disabled=false;authError(error.message||'確認コードが一致しません。')}).verifyEmailLogin(authEmail,code)}
function verifyAppSession(session){google.script.run.withSuccessHandler(context=>{authToken=session;document.getElementById('authGate').classList.add('hidden');authReadyCallback(session,context)}).withFailureHandler(()=>{sessionStorage.removeItem('hosei_app_session');showEmailStep()}).getAuthContext(session)}
function authError(message){document.getElementById('authMessage').textContent=String(message).replace(/^(AUTH_REQUIRED|AUTH_EXPIRED):\s*/,'')}
</script>
